name: Release

# Signs, notarises and publishes a tagged build.
#
# Signing happens here rather than on a laptop because the Developer ID certificate and the
# App Store Connect key are repository secrets: nobody has to hold them locally, and a
# release cannot accidentally ship from an unsigned working copy.
#
# Requires these secrets, the same names roder uses so the values copy across unchanged:
#
#   APPLE_CERTIFICATE_BASE64    Developer ID Application .p12, base64
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_NOTARIZE_KEY_BASE64   App Store Connect API key (.p8), base64
#   APPLE_NOTARIZE_KEY_ID       that key's id
#   APPLE_NOTARIZE_ISSUER_ID    the issuer id
#   HOMEBREW_TAP_TOKEN          a token that can push to PandelisZ/homebrew-tap
#
# Note the certificate must be **Developer ID Application**. An "Apple Development"
# certificate signs, but notarisation refuses it, and Gatekeeper then reports the app as
# damaged — which is the failure this whole workflow exists to remove.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Work out the version
        id: v
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build
        run: ./Scripts/bundle.sh

      - name: Import the signing certificate
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CERT CERT_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "${name} is required; see the header of this workflow" >&2
              exit 1
            fi
          done

          # A throwaway keychain, so nothing is added to the runner's login keychain and the
          # certificate never outlives the job.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a UI prompt that never appears on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity in the certificate." >&2
            echo "An Apple Development certificate cannot be notarised." >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      - name: Sign
        run: |
          set -euo pipefail
          APP="build/CodexRemote.app"

          # Inside-out: nested code has to be signed before the bundle that contains it.
          # The bundled CLI is a Mach-O of its own and is not covered by signing the app.
          for binary in "$APP/Contents/MacOS/"*; do
            [ -f "$binary" ] || continue
            codesign --force --timestamp --options runtime \
              --entitlements Scripts/CodexRemote.entitlements \
              --sign "$IDENTITY" "$binary"
          done

          codesign --force --timestamp --options runtime \
            --entitlements Scripts/CodexRemote.entitlements \
            --sign "$IDENTITY" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarise
        env:
          KEY: ${{ secrets.APPLE_NOTARIZE_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_NOTARIZE_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_NOTARIZE_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in KEY KEY_ID ISSUER; do
            if [ -z "${!name:-}" ]; then
              echo "${name} is required; see the header of this workflow" >&2
              exit 1
            fi
          done

          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          # ditto, not zip: it preserves the bundle's symlinks and signature, which zip
          # flattens — and a flattened bundle fails notarisation.
          ditto -c -k --keepParent --sequesterRsrc build/CodexRemote.app "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8"

          # Stapling writes the ticket into the bundle so it validates offline. Without it a
          # first launch with no network still shows the damaged dialog.
          xcrun stapler staple build/CodexRemote.app
          xcrun stapler validate build/CodexRemote.app
          spctl -a -vvv -t install build/CodexRemote.app

      - name: Package
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          mkdir -p dist
          ZIP="dist/CodexRemote-$VERSION.zip"
          # Zipped after stapling, so the ticket travels with the download.
          ditto -c -k --keepParent --sequesterRsrc build/CodexRemote.app "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.package.outputs.zip }}" --clobber
          else
            gh release create "$TAG" "${{ steps.package.outputs.zip }}" \
              --title "Codex Remote ${{ steps.v.outputs.version }}" --generate-notes
          fi

      - name: Update the feed and the cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          SHA="${{ steps.package.outputs.sha }}"
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/CodexRemote-$VERSION.zip"

          python3 - "$VERSION" "$URL" "$SHA" <<'PY'
          import json, sys, datetime, pathlib
          version, url, sha = sys.argv[1:4]
          feed = pathlib.Path("site/latest.json")
          existing = json.loads(feed.read_text()) if feed.exists() else {}
          existing.update({
              "version": version, "url": url, "sha256": sha,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc)
                               .replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "minimumSystemVersion": "15.0",
          })
          feed.write_text(json.dumps(existing, indent=2) + "\n")
          PY

          git config user.name "Pandelis Zembashis"
          git config user.email "p@ndel.is"
          git add site/latest.json
          git diff --cached --quiet || git commit -m "Feed: $VERSION"
          git push origin HEAD:main

          if [ -n "${TAP_TOKEN:-}" ]; then
            TAP="$(mktemp -d)"
            git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/PandelisZ/homebrew-tap.git" "$TAP"
            cask="$TAP/Casks/codex-remote.rb"
            /usr/bin/sed -i '' -E "s/version \"[^\"]+\"/version \"$VERSION\"/" "$cask"
            /usr/bin/sed -i '' -E "s/sha256 \"[0-9a-f]{64}\"/sha256 \"$SHA\"/" "$cask"
            # Notarised builds carry their own ticket, so the quarantine workaround goes.
            python3 "$GITHUB_WORKSPACE/Scripts/cask-notarised.py" "$cask"
            git -C "$TAP" config user.name "Pandelis Zembashis"
            git -C "$TAP" config user.email "p@ndel.is"
            git -C "$TAP" commit -qam "codex-remote $VERSION"
            git -C "$TAP" push -q origin main
          fi

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
